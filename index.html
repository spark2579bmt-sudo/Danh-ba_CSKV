<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh sách CSKV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans" x-data="cskvApp()" x-init="init()">

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="shield-user" class="w-8 h-8 text-blue-600"></i> Quản lý Danh sách CSKV
                </h1>
                <p class="text-gray-500 text-sm mt-1">Hệ thống quản lý thông tin cán bộ phụ trách khu vực</p>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <button @click="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow transition">
                    <i data-lucide="user-plus" class="w-5 h-5"></i> Thêm mới
                </button>
                <button @click="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow transition">
                    <i data-lucide="file-spreadsheet" class="w-5 h-5"></i> Xuất Excel
                </button>
                <label class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow transition cursor-pointer">
                    <i data-lucide="file-up" class="w-5 h-5"></i> Nhập Excel
                    <input type="file" accept=".xlsx, .xls" class="hidden" @change="importExcel($event)">
                </label>
                <button @click="confirmDeleteAll()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow transition">
                    <i data-lucide="trash-2" class="w-5 h-5"></i> Xóa toàn bộ
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm font-medium">Tổng số CSKV</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1" x-text="cskvList.length">0</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm font-medium">Tổng số Hộ thường trú</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1" x-text="totalHoThuongTru">0</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
                    <i data-lucide="home" class="w-6 h-6"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm font-medium">Tổng số Khẩu thường trú</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1" x-text="totalKhauThuongTru">0</h3>
                </div>
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg">
                    <i data-lucide="user-check" class="w-6 h-6"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm font-medium">Tổng số Khẩu tạm trú</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1" x-text="totalKhauTamTru">0</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">
                    <i data-lucide="users-round" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="flex flex-wrap gap-3 w-full md:w-auto flex-1">
                <div class="relative flex-1 min-w-[200px]">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <input type="text" x-model="searchQuery" placeholder="Tìm theo tên, quê quán, địa bàn..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <input type="text" x-model="filterChucVu" placeholder="Lọc theo chức vụ..." class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm w-full md:w-48">
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                <span class="text-sm text-gray-500 whitespace-nowrap">Sắp xếp:</span>
                <select x-model="sortBy" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                    <option value="name_asc">Họ tên (A-Z)</option>
                    <option value="name_desc">Họ tên (Z-A)</option>
                    <option value="dob_asc">Năm sinh (Tăng dần)</option>
                </select>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs font-semibold uppercase tracking-wider">
                            <th class="py-3 px-4 text-center w-16">TT</th>
                            <th class="py-3 px-4 w-20">Ảnh</th>
                            <th class="py-3 px-4">Họ tên</th>
                            <th class="py-3 px-4">Chức vụ / Cấp bậc</th>
                            <th class="py-3 px-4">Địa bàn phụ trách</th>
                            <th class="py-3 px-4 text-center">Hộ/Khẩu TT</th>
                            <th class="py-3 px-4 text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-sm text-gray-700">
                        <template x-for="(item, index) in filteredList" :key="item.id">
                            <tr class="hover:bg-gray-50 transition">
                                <td class="py-3 px-4 text-center font-medium text-gray-500" x-text="index + 1"></td>
                                <td class="py-3 px-4">
                                    <img :src="item.image || 'https://via.placeholder.com/150?text=No+Image'" class="w-10 h-10 object-cover rounded-full border border-gray-300 shadow-sm">
                                </td>
                                <td class="py-3 px-4">
                                    <div class="font-bold text-gray-900" x-text="item.hoTen"></div>
                                    <div class="text-xs text-gray-500" x-text="'NS: ' + item.namSinh + ' (' + item.gioiTinh + ')'"></div>
                                </td>
                                <td class="py-3 px-4">
                                    <div class="font-medium" x-text="item.chucVu"></div>
                                    <div class="text-xs text-blue-600 font-semibold" x-text="item.capBac"></div>
                                </td>
                                <td class="py-3 px-4">
                                    <div class="text-gray-900" x-text="item.diaBan"></div>
                                    <div class="text-xs text-gray-500" x-text="'SĐT: ' + item.sdt"></div>
                                </td>
                                <td class="py-3 px-4 text-center">
                                    <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-medium" x-text="item.hoThuongTru + ' hộ / ' + item.khauThuongTru + ' khẩu'"></span>
                                </td>
                                <td class="py-3 px-4 text-center">
                                    <div class="flex items-center justify-center gap-2">
                                        <button @click="editItem(item)" class="p-1.5 bg-yellow-50 text-yellow-600 hover:bg-yellow-100 rounded-lg transition" title="Sửa">
                                            <i data-lucide="pencil" class="w-4 h-4"></i>
                                        </button>
                                        <button @click="deleteItem(item.id)" class="p-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg transition" title="Xóa">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                        <template x-if="filteredList.length === 0">
                            <tr>
                                <td colspan="7" class="py-8 text-center text-gray-400">Không tìm thấy dữ liệu phù hợp.</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-50 flex items-center justify-center p-4" style="display: none;">
            <div @click.outside="closeModal()" class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden transform transition-all">
                <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
                    <h3 class="text-lg font-bold" x-text="isEditing ? 'Cập nhật thông tin CSKV' : 'Thêm mới CSKV'"></h3>
                    <button @click="closeModal()" class="text-white hover:text-gray-200"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                
                <form @submit.prevent="saveItem()" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                    
                    <div class="flex flex-col sm:flex-row items-center gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <img :src="form.image || 'https://via.placeholder.com/150?text=No+Image'" class="w-24 h-24 object-cover rounded-xl border border-gray-300 shadow">
                        <div class="flex-1 space-y-2 w-full">
                            <label class="block text-sm font-medium text-gray-700">Hình ảnh đại diện</label>
                            <div class="flex flex-wrap gap-2">
                                <label class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer flex items-center gap-1 shadow-sm">
                                    <i data-lucide="upload" class="w-4 h-4"></i> Chọn file ảnh
                                    <input type="file" accept="image/*" class="hidden" @change="handleFileUpload($event)">
                                </label>
                                <button type="button" @click="startCamera()" class="bg-blue-50 border border-blue-200 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1 shadow-sm">
                                    <i data-lucide="camera" class="w-4 h-4"></i> Mở Camera
                                </button>
                            </div>
                        </div>
                    </div>

                    <div x-show="isCameraOpen" class="space-y-2 bg-black p-2 rounded-xl text-center">
                        <video id="cameraStream" autoplay playsinline class="w-full max-h-64 object-contain rounded-lg mx-auto"></video>
                        <div class="flex justify-center gap-2">
                            <button type="button" @click="capturePhoto()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-lg text-xs font-medium">Chụp ảnh</button>
                            <button type="button" @click="stopCamera()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-lg text-xs font-medium">Đóng camera</button>
                        </div>
                    </div>
                    <canvas id="cameraCanvas" class="hidden"></canvas>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Họ tên *</label>
                            <input type="text" x-model="form.hoTen" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Năm sinh / Ngày sinh *</label>
                            <input type="text" x-model="form.namSinh" placeholder="VD: 25/07/1979" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Giới tính</label>
                            <select x-model="form.gioiTinh" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Chức vụ</label>
                            <input type="text" x-model="form.chucVu" placeholder="VD: Cảnh sát khu vực" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Cấp bậc</label>
                            <input type="text" x-model="form.capBac" placeholder="VD: Đại úy" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Số điện thoại</label>
                            <input type="text" x-model="form.sdt" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Quê quán</label>
                            <input type="text" x-model="form.queQuan" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nơi cư trú</label>
                            <input type="text" x-model="form.noiCuTru" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Địa bàn phụ trách</label>
                            <input type="text" x-model="form.diaBan" placeholder="VD: Khu phố 1, Phường X..." class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tổng số hộ thường trú</label>
                            <input type="number" x-model.number="form.hoThuongTru" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tổng số khẩu thường trú</label>
                            <input type="number" x-model.number="form.khauThuongTru" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tổng số hộ tạm trú</label>
                            <input type="number" x-model.number="form.hoTamTru" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tổng số khẩu tạm trú</label>
                            <input type="number" x-model.number="form.khauTamTru" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Ghi chú</label>
                            <textarea x-model="form.ghiChu" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
                        <button type="button" @click="closeModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-medium">Hủy</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow">Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('cskvApp', () => ({
                cskvList: [],
                searchQuery: '',
                filterChucVu: '',
                sortBy: 'name_asc',
                showModal: false,
                isEditing: false,
                isCameraOpen: false,
                mediaStream: null,
                
                form: {
                    id: null,
                    image: '',
                    hoTen: '',
                    namSinh: '',
                    gioiTinh: 'Nam',
                    chucVu: '',
                    queQuan: '',
                    noiCuTru: '',
                    capBac: '',
                    sdt: '',
                    diaBan: '',
                    hoThuongTru: 0,
                    khauThuongTru: 0,
                    hoTamTru: 0,
                    khauTamTru: 0,
                    ghiChu: ''
                },

                init() {
                    const savedData = localStorage.getItem('cskv_data');
                    if (savedData) {
                        this.cskvList = JSON.parse(savedData);
                    } else {
                        // Dữ liệu mẫu ban đầu
                        this.cskvList = [
                            {
                                id: 1,
                                image: '',
                                hoTen: 'Nguyễn Văn A',
                                namSinh: '25/07/1979',
                                gioiTinh: 'Nam',
                                chucVu: 'Cảnh sát khu vực',
                                queQuan: 'Hà Nội',
                                noiCuTru: 'Đà Nẵng',
                                capBac: 'Thiếu tá',
                                sdt: '0905123456',
                                diaBan: 'Khu phố 1',
                                hoThuongTru: 120,
                                khauThuongTru: 450,
                                hoTamTru: 15,
                                khauTamTru: 30,
                                ghiChu: 'Hoàn thành xuất sắc nhiệm vụ'
                            }
                        ];
                        this.saveToStorage();
                    }
                    this.$watch('cskvList', () => {
                        this.saveToStorage();
                        this.$nextTick(() => lucide.createIcons());
                    });
                    this.$nextTick(() => lucide.createIcons());
                },

                saveToStorage() {
                    localStorage.setItem('cskv_data', JSON.stringify(this.cskvList));
                },

                get totalHoThuongTru() {
                    return this.cskvList.reduce((sum, item) => sum + Number(item.hoThuongTru || 0), 0);
                },
                get totalKhauThuongTru() {
                    return this.cskvList.reduce((sum, item) => sum + Number(item.khauThuongTru || 0), 0);
                },
                get totalKhauTamTru() {
                    return this.cskvList.reduce((sum, item) => sum + Number(item.khauTamTru || 0), 0);
                },

                get filteredList() {
                    let result = [...this.cskvList];

                    // Tìm kiếm nhanh
                    if (this.searchQuery.trim() !== '') {
                        const q = this.searchQuery.toLowerCase();
                        result = result.filter(item => 
                            item.hoTen.toLowerCase().includes(q) ||
                            (item.diaBan && item.diaBan.toLowerCase().includes(q)) ||
                            (item.queQuan && item.queQuan.toLowerCase().includes(q)) ||
                            (item.sdt && item.sdt.toLowerCase().includes(q))
                        );
                    }

                    // Lọc chức vụ
                    if (this.filterChucVu.trim() !== '') {
                        const cv = this.filterChucVu.toLowerCase();
                        result = result.filter(item => item.chucVu && item.chucVu.toLowerCase().includes(cv));
                    }

                    // Sắp xếp
                    result.sort((a, b) => {
                        if (this.sortBy === 'name_asc') return a.hoTen.localeCompare(b.hoTen);
                        if (this.sortBy === 'name_desc') return b.hoTen.localeCompare(a.hoTen);
                        if (this.sortBy === 'dob_asc') return a.namSinh.localeCompare(b.namSinh);
                        return 0;
                    });

                    return result;
                },

                openModal() {
                    this.isEditing = false;
                    this.form = {
                        id: Date.now(),
                        image: '',
                        hoTen: '',
                        namSinh: '',
                        gioiTinh: 'Nam',
                        chucVu: '',
                        queQuan: '',
                        noiCuTru: '',
                        capBac: '',
                        sdt: '',
                        diaBan: '',
                        hoThuongTru: 0,
                        khauThuongTru: 0,
                        hoTamTru: 0,
                        khauTamTru: 0,
                        ghiChu: ''
                    };
                    this.showModal = true;
                },

                editItem(item) {
                    this.isEditing = true;
                    this.form = { ...item };
                    this.showModal = true;
                },

                closeModal() {
                    this.showModal = false;
                    this.stopCamera();
                },

                saveItem() {
                    if (this.isEditing) {
                        const index = this.cskvList.findIndex(i => i.id === this.form.id);
                        if (index !== -1) {
                            this.cskvList[index] = { ...this.form };
                        }
                    } else {
                        this.cskvList.push({ ...this.form });
                    }
                    this.closeModal();
                },

                deleteItem(id) {
                    if (confirm('Bạn có chắc chắn muốn xóa cán bộ này?')) {
                        this.cskvList = this.cskvList.filter(i => i.id !== id);
                    }
                },

                confirmDeleteAll() {
                    if (confirm('CẢNH BÁO: Hành động này sẽ xóa toàn bộ dữ liệu danh sách CSKV. Bạn có chắc chắn?')) {
                        this.cskvList = [];
                    }
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.form.image = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                },

                async startCamera() {
                    this.isCameraOpen = true;
                    try {
                        this.mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
                        this.$nextTick(() => {
                            const video = document.getElementById('cameraStream');
                            if (video) video.srcObject = this.mediaStream;
                        });
                    } catch (err) {
                        alert('Không thể mở được camera. Vui lòng kiểm tra quyền truy cập!');
                        this.isCameraOpen = false;
                    }
                },

                capturePhoto() {
                    const video = document.getElementById('cameraStream');
                    const canvas = document.getElementById('cameraCanvas');
                    if (video && canvas) {
                        canvas.width = video.videoWidth || 320;
                        canvas.height = video.videoHeight || 240;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        this.form.image = canvas.toDataURL('image/png');
                        this.stopCamera();
                    }
                },

                stopCamera() {
                    if (this.mediaStream) {
                        this.mediaStream.getTracks().forEach(track => track.stop());
                        this.mediaStream = null;
                    }
                    this.isCameraOpen = false;
                },

                exportExcel() {
                    const dataToExport = this.cskvList.map((item, index) => ({
                        'STT': index + 1,
                        'Họ tên': item.hoTen,
                        'Năm sinh': item.namSinh,
                        'Giới tính': item.gioiTinh,
                        'Cấp bậc': item.capBac,
                        'Chức vụ': item.chucVu,
                        'Quê quán': item.queQuan,
                        'Nơi cư trú': item.noiCuTru,
                        'Số điện thoại': item.sdt,
                        'Địa bàn phụ trách': item.diaBan,
                        'Hộ thường trú': item.hoThuongTru,
                        'Khẩu thường trú': item.khauThuongTru,
                        'Hộ tạm trú': item.hoTamTru,
                        'Khẩu tạm trú': item.khauTamTru,
                        'Ghi chú': item.ghiChu
                    }));

                    const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "DanhSachCSKV");
                    XLSX.writeFile(workbook, "DanhSach_CSKV.xlsx");
                },

                importExcel(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            const json = XLSX.utils.sheet_to_json(worksheet);

                            const imported = json.map((row, index) => ({
                                id: Date.now() + index,
                                image: '',
                                hoTen: row['Họ tên'] || '',
                                namSinh: row['Năm sinh'] ? String(row['Năm sinh']) : '',
                                gioiTinh: row['Giới tính'] || 'Nam',
                                capBac: row['Cấp bậc'] || '',
                                chucVu: row['Chức vụ'] || '',
                                queQuan: row['Quê quán'] || '',
                                noiCuTru: row['Nơi cư trú'] || '',
                                sdt: row['Số điện thoại'] ? String(row['Số điện thoại']) : '',
                                diaBan: row['Địa bàn phụ trách'] || '',
                                hoThuongTru: Number(row['Hộ thường trú'] || 0),
                                khauThuongTru: Number(row['Khẩu thường trú'] || 0),
                                hoTamTru: Number(row['Hộ tạm trú'] || 0),
                                khauTamTru: Number(row['Khẩu tạm trú'] || 0),
                                ghiChu: row['Ghi chú'] || ''
                            }));

                            this.cskvList.push(...imported);
                            alert(`Đã nhập thành công ${imported.length} bản ghi từ file Excel!`);
                        } catch (err) {
                            alert('Lỗi đọc file Excel. Vui lòng kiểm tra lại định dạng!');
                        }
                        event.target.value = '';
                    };
                    reader.readAsArrayBuffer(file);
                }
            }));
        });
    </script>
</body>
